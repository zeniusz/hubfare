# docker compose up -d                       -> SQLite (simplest, one small VPS)
# docker compose --profile postgres up -d    -> adds PostgreSQL; set DATABASE_URL in .env to:
#   postgresql+psycopg://travel:travel@db:5432/travel_edge
services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 60s

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes: ["data:/data"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_edge
    volumes: ["pg:/var/lib/postgresql/data"]
    restart: unless-stopped

volumes:
  data:
  pg:
